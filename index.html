<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto News Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 12px;
        }
        .terminal-header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .terminal-header h1 {
            font-size: 1.2rem;
            color: #7ee787;
            margin: 0 0 4px 0;
        }
        .status {
            font-size: 0.75rem;
            color: #8b949e;
        }
        .section-title {
            font-size: 0.85rem;
            color: #ffb454;
            margin: 15px 0 8px 0;
            text-transform: uppercase;
            border-left: 3px solid #ffb454;
            padding-left: 6px;
        }
        .market-box, .news-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .market-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #30363d;
        }
        .market-row:last-child {
            border-bottom: none;
        }
        .news-title {
            color: #f0f6fc;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .news-title:hover {
            color: #58a6ff;
            text-decoration: underline;
        }
        .news-meta {
            font-size: 0.7rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="terminal-header">
        <h1>> CRYPTO_TERMINAL_v1.2</h1>
        <div class="status">Status: Online | Secure Feed Active</div>
    </div>

    <div class="section-title">Market Watch</div>
    <div class="market-box" id="market-feed">
        <div class="market-row"><span>Memuat data harga...</span></div>
    </div>

    <div class="section-title">Global Crypto News</div>
    <div id="news-feed">
        <div class="news-item">Mengambil siaran berita global...</div>
    </div>

    <script>
        // Ambil Data Harga Crypto
        async function loadMarket() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,ripple,cardano&vs_currencies=usd&include_24hr_change=true');
                const data = await res.json();
                
                const marketDiv = document.getElementById('market-feed');
                marketDiv.innerHTML = `
                    <div class="market-row"><span>BTC/USD</span> <span>$${data.bitcoin.usd.toLocaleString()} (${data.bitcoin.usd_24h_change.toFixed(2)}%)</span></div>
                    <div class="market-row"><span>ETH/USD</span> <span>$${data.ethereum.usd.toLocaleString()} (${data.ethereum.usd_24h_change.toFixed(2)}%)</span></div>
                    <div class="market-row"><span>SOL/USD</span> <span>$${data.solana.usd.toLocaleString()} (${data.solana.usd_24h_change.toFixed(2)}%)</span></div>
                    <div class="market-row"><span>XRP/USD</span> <span>$${data.ripple.usd.toLocaleString()} (${data.ripple.usd_24h_change.toFixed(2)}%)</span></div>
                    <div class="market-row"><span>ADA/USD</span> <span>$${data.cardano.usd.toLocaleString()} (${data.cardano.usd_24h_change.toFixed(2)}%)</span></div>
                `;
            } catch (err) {
                console.log("Market error");
            }
        }

        // Ambil Berita Crypto
        async function loadNews() {
            const container = document.getElementById('news-feed');
            try {
                const res = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN');
                const json = await res.json();
                
                if (json && json.Data) {
                    container.innerHTML = '';
                    json.Data.slice(0, 6).forEach(item => {
                        container.innerHTML += `
                            <div class="news-item">
                                <a href="${item.url}" target="_blank" class="news-title">${item.title}</a>
                                <div class="news-meta">Sumber: ${item.source_info.name}</div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                container.innerHTML = `<div class="news-item" style="color: #f85149;">Gagal memuat berita terbaru.</div>`;
            }
        }

        loadMarket();
        loadNews();

        // Refresh otomatis setiap 1 menit
        setInterval(() => {
            loadMarket();
            loadNews();
        }, 60000);
    </script>

</body>
</html>
