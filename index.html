<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto News Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffb454;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
        }
        .terminal-container {
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
        }
        .panel-title {
            font-size: 0.85rem;
            color: #7ee787;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Market Watch Table */
        .market-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .market-table th, .market-table td {
            text-align: left;
            padding: 6px 4px;
        }
        .market-table th {
            color: #8b949e;
            font-weight: normal;
        }
        .price-up {
            color: #56d364;
        }
        /* News List */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }
        .news-item {
            border-bottom: 1px dashed #30363d;
            padding-bottom: 8px;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-link {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 4px;
        }
        .news-link:hover {
            text-decoration: underline;
        }
        .news-time {
            font-size: 0.7rem;
            color: #8b949e;
        }
        /* Logs */
        .logs {
            font-size: 0.75rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- Market Watch Panel -->
        <div class="panel">
            <div class="panel-title">> Market Watch (Live)</div>
            <table class="market-table">
                <thead>
                    <tr>
                        <th>Asset</th>
                        <th>Price (USD)</th>
                        <th>24h</th>
                    </tr>
                </thead>
                <tbody id="market-data">
                    <tr><td colspan="3">Memuat data pasar...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Global Crypto News Feed Panel -->
        <div class="panel">
            <div class="panel-title">> Global Crypto Wire & News Feed</div>
            <div id="news-container" class="news-list">
                <div class="news-item">Menghubungkan ke jaringan data berita global...</div>
            </div>
        </div>

        <!-- System Logs -->
        <div class="panel">
            <div class="panel-title">> System Logs</div>
            <div class="logs" id="system-logs">
                [02:51:00] WS_CONNECT: OK<br>
                [02:51:02] FEED_PARSER: ACTIVE<br>
                [02:51:05] SECURE_SOCKET: LISTENING
            </div>
        </div>
    </div>

    <script>
        // Fungsi Ambil Harga Crypto Real-Time
        async function fetchMarketData() {
            try {
                const res = await fetch('https://min-api.cryptocompare.com/data/pricemultifull?fsyms=BTC,ETH,SOL,XRP,ADA&tsyms=USD');
                const json = await res.json();
                const tbody = document.getElementById('market-data');
                tbody.innerHTML = '';

                const coins = ['BTC', 'ETH', 'SOL', 'XRP', 'ADA'];
                coins.forEach(coin => {
                    const data = json.RAW[coin].USD;
                    const price = data.PRICE.toLocaleString();
                    const change = data.CHANGEPCT24HOUR.toFixed(2);
                    const changeClass = change >= 0 ? 'price-up' : '';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${coin}/USDT</td>
                            <td>$${price}</td>
                            <td class="${changeClass}">${change >= 0 ? '+' : ''}${change}%</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Gagal memuat pasar");
            }
        }

        // Fungsi Ambil Berita Crypto Real-Time
        async function fetchNews() {
            const container = document.getElementById('news-container');
            try {
                const res = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN');
                const json = await res.json();
                
                if (json && json.Data) {
                    container.innerHTML = '';
                    json.Data.slice(0, 8).forEach(item => {
                        const date = new Date(item.published_on * 1000).toLocaleTimeString();
                        container.innerHTML += `
                            <div class="news-item">
                                <a href="${item.url}" target="_blank" class="news-link">${item.title}</a>
                                <div class="news-time">[${date}] Source: ${item.source_info.name}</div>
                            </div>
                        `;
                    });
                }
            } catch (e) {
                container.innerHTML = `<div class="news-item" style="color: #ff5555;">Gagal memuat berita terbaru.</div>`;
            }
        }

        // Jalankan saat pertama kali dibuka
        fetchMarketData();
        fetchNews();

        // Auto refresh setiap 60 detik (1 menit)
        setInterval(() => {
            fetchMarketData();
            fetchNews();
        }, 60000);
    </script>

</body>
</html>
