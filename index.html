<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto News Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        .terminal-header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .terminal-header h1 {
            font-size: 1.5rem;
            color: #7ee787;
            margin: 0;
        }
        .status {
            font-size: 0.85rem;
            color: #8b949e;
        }
        .news-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .news-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
        }
        .news-title {
            color: #f0f6fc;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .news-title:hover {
            text-decoration: underline;
            color: #58a6ff;
        }
        .news-meta {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="terminal-header">
        <h1>> CRYPTO_NEWS_TERMINAL_v1.0</h1>
        <div class="status">Status: Connected | Live Feed Active</div>
    </div>

    <div id="news" class="news-container">
        <div class="news-item">Memuat berita kripto terbaru...</div>
    </div>

    <script>
        async function fetchCryptoNews() {
            const container = document.getElementById('news');
            try {
                // Menggunakan API publik gratis untuk berita kripto
                const response = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN');
                const data = await response.json();
                
                if (data && data.Data) {
                    container.innerHTML = '';
                    // Ambil 10 berita teratas
                    data.Data.slice(0, 10).forEach(item => {
                        const newsEl = document.createElement('div');
                        newsEl.className = 'news-item';
                        
                        newsEl.innerHTML = `
                            <a href="${item.url}" target="_blank" class="news-title">${item.title}</a>
                            <div class="news-meta">Sumber: ${item.source_info.name} | Kategori: ${item.categories}</div>
                        `;
                        container.appendChild(newsEl);
                    });
                }
            } catch (error) {
                container.innerHTML = `<div class="news-item" style="color: #f85149;">Gagal memuat berita: Koneksi terputus.</div>`;
            }
        }

        fetchCryptoNews();
        // Refresh otomatis setiap 5 menit
        setInterval(fetchCryptoNews, 300000);
    </script>

</body>
</html>
