<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto News Terminal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 12px;
        }
        .terminal-header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .terminal-header h1 {
            font-size: 1.1rem;
            color: #7ee787;
            margin: 0 0 4px 0;
        }
        .status {
            font-size: 0.7rem;
            color: #8b949e;
        }
        .section-title {
            font-size: 0.8rem;
            color: #ffb454;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            border-left: 3px solid #ffb454;
            padding-left: 6px;
        }
        .box {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .market-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #30363d;
        }
        .market-row:last-child {
            border-bottom: none;
        }
        .news-item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #30363d;
        }
        .news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .news-title {
            color: #f0f6fc;
            text-decoration: none;
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .news-title:hover {
            color: #58a6ff;
            text-decoration: underline;
        }
        .news-meta {
            font-size: 0.65rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="terminal-header">
        <h1>> CRYPTO_TERMINAL_v1.4</h1>
        <div class="status">Status: Connected | Live Feed Active</div>
    </div>

    <div class="section-title">Market Watch</div>
    <div class="box" id="market-feed">
        <div class="market-row"><span>Memuat harga pasar...</span></div>
    </div>

    <div class="section-title">Global Crypto News</div>
    <div class="box" id="news-feed">
        <div>Mengunduh siaran berita...</div>
    </div>

    <script>
        async function loadData() {
            // 1. Load Market Data
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,ripple,cardano&vs_currencies=usd&include_24hr_change=true');
                const data = await res.json();
                
                document.getElementById('market-feed').innerHTML = `
                    <div class="market-row"><span>BTC/USD</span> <span>$${data.bitcoin.usd.toLocaleString()} <b style="color:${data.bitcoin.usd_24h_change>=0?'#56d364':'#f85149'}">${data.bitcoin.usd_24h_change.toFixed(2)}%</b></span></div>
                    <div class="market-row"><span>ETH/USD</span> <span>$${data.ethereum.usd.toLocaleString()} <b style="color:${data.ethereum.usd_24h_change>=0?'#56d364':'#f85149'}">${data.ethereum.usd_24h_change.toFixed(2)}%</b></span></div>
                    <div class="market-row"><span>SOL/USD</span> <span>$${data.solana.usd.toLocaleString()} <b style="color:${data.solana.usd_24h_change>=0?'#56d364':'#f85149'}">${data.solana.usd_24h_change.toFixed(2)}%</b></span></div>
                    <div class="market-row"><span>XRP/USD</span> <span>$${data.ripple.usd.toLocaleString()} <b style="color:${data.ripple.usd_24h_change>=0?'#56d364':'#f85149'}">${data.ripple.usd_24h_change.toFixed(2)}%</b></span></div>
                    <div class="market-row"><span>ADA/USD</span> <span>$${data.cardano.usd.toLocaleString()} <b style="color:${data.cardano.usd_24h_change>=0?'#56d364':'#f85149'}">${data.cardano.usd_24h_change.toFixed(2)}%</b></span></div>
                `;
            } catch (e) {
                document.getElementById('market-feed').innerHTML = `<div class="market-row"><span style="color:#f85149">Gagal memuat harga pasar.</span></div>`;
            }

            // 2. Load News Feed (CoinGecko Status Updates / Public RSS Proxy)
            try {
                const resNews = await fetch('https://api.coingecko.com/api/v3/status_updates');
                const jsonNews = await resNews.json();
                
                if (jsonNews && jsonNews.status_updates) {
                    let htmlContent = '';
                    jsonNews.status_updates.slice(0, 5).forEach(item => {
                        let desc = item.description.length > 90 ? item.description.substring(0, 90) + '...' : item.description;
                        htmlContent += `
                            <div class="news-item">
                                <a href="${item.project.link || '#'}" target="_blank" class="news-title">${item.project.name}: Berita Pembaruan</a>
                                <div style="font-size:0.75rem; color:#c9d1d9; margin-bottom:3px;">${desc}</div>
                                <div class="news-meta">Kategori: ${item.category} | Sumber: Resmi Proyek</div>
                            </div>
                        `;
                    });
                    document.getElementById('news-feed').innerHTML = htmlContent;
                }
            } catch (e) {
                document.getElementById('news-feed').innerHTML = `<div style="color: #f85149;">Gagal memuat berita.</div>`;
            }
        }

        loadData();
        setInterval(loadData, 60000);
    </script>

</body>
</html>
